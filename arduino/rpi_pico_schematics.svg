    <g font-size="12">
      <text x="39" y="1360">From left to right, fan contacts are 4 (PWM), 3 (tachometer), 2 (+12V), and 1 (GND).</text>
      <text x="39" y="1376">Use the same PSU for 5 V (Pico via USB) and 12 V (fans). Connect their grounds.</text>
      <text x="39" y="1392">Non-standby 5 V is recommended to avoid backfeeding unpowered fans through PWM.</text>
      <text x="39" y="1408">(!) Use fans with a 3.3 V PWM level (most of the recent fans are).</text>
      <text x="39" y="1424">Measure it with the fan powered and the PWM wire disconnected.</text>
    </g>
