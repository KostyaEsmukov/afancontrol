[tox]
envlist=py{311,312,313,314,315,316}{,-arduino,-metrics},lint,check-docs

[testenv]
extras =
    arduino: arduino
    dev
    metrics: metrics
allowlist_externals = make
commands = make test
; Fix coverage not working because tox doesn't install
; sources to the working dir by default.
usedevelop = True

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315
    3.16: py316

[testenv:lint]
extras =
    arduino
    dev
    metrics
basepython = python3
; Use `pip install -e .` so isort would treat imports from this package
; as first party imports instead of third party:
usedevelop = True
commands = make lint

[testenv:check-docs]
basepython = python3
deps = setuptools
commands = make check-docs
